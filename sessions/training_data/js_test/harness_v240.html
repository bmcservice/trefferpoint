<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>v2.4.0 Browser-Harness</title>
<style>
  body{background:#0e1116;color:#e8eef2;font-family:system-ui,sans-serif;margin:0;padding:16px}
  h1{font-size:18px}
  .phase{margin:14px 0;padding:12px;background:#1a212b;border:1px solid #2a3340;border-radius:6px}
  .metric{font-family:'Consolas',monospace;font-size:14px;line-height:1.6}
  .ok{color:#5f5} .bad{color:#f77} .dim{color:#8a99a8}
  canvas{border:1px solid #2a3340;border-radius:4px;margin-top:8px;max-width:100%}
  #summary{margin-top:16px;padding:14px;background:#16241a;border:1px solid #2a5a3a;border-radius:6px;font-family:monospace;white-space:pre-wrap}
</style>
</head>
<body>
<h1>◎ v2.4.0 Browser-Harness — canvas ImageData → TPDetect</h1>
<div class="dim">Beweist: Browser-Variante (canvas RGBA → Luma) liefert dieselben Treffer wie Node-Referenz (90%/90%).</div>
<div id="phases"></div>
<div id="summary">läuft…</div>

<script src="detection_v240.js"></script>
<script>
const SP = { cx: 784, cy: 515, r: 229, pxPerMm: 2.29 };
const GT = {
  '1a': [{x:33,y:-76},{x:25,y:-46},{x:45,y:-6},{x:-30,y:10},{x:135.5,y:-54.7}],
  '1b': [{x:-74.9,y:-7.6},{x:28.6,y:-38.7},{x:26.1,y:20.2},{x:58.1,y:25.3},{x:5.9,y:69.0}],
};

function loadImageData(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = img.width; cv.height = img.height;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0);
      res(ctx.getImageData(0, 0, img.width, img.height));
    };
    img.onerror = rej;
    img.src = src;
  });
}

function match(dets, gt, sp, mx = 15) {
  const pairs = [];
  dets.forEach((d, di) => gt.forEach((g, gi) => {
    const dmm = Math.hypot((d.x - sp.cx)/sp.pxPerMm - g.x, (d.y - sp.cy)/sp.pxPerMm - g.y);
    pairs.push([dmm, di, gi]);
  }));
  pairs.sort((a,b)=>a[0]-b[0]);
  const ud=new Set(), ug=new Set(), ms=[];
  for (const [dist,di,gi] of pairs){
    if (dist>mx) break;
    if (ud.has(di)||ug.has(gi)) continue;
    ud.add(di); ug.add(gi); ms.push(dist);
  }
  return { nMatch: ms.length, nFP: dets.length-ud.size, ud, ug, dists: ms };
}

function renderPhase(name, postImgData, dets, gt, m, shift, dt) {
  const div = document.createElement('div');
  div.className = 'phase';
  const med = m.dists.length ? [...m.dists].sort((a,b)=>a-b)[m.dists.length>>1] : 0;
  const recall = 100*m.nMatch/gt.length;
  div.innerHTML = `<div class="metric"><b>${name}</b> — shift dx=${shift.dx} dy=${shift.dy}, ${dt}ms<br>`+
    `${dets.length} Det, <span class="${recall>=80?'ok':'bad'}">${m.nMatch}/${gt.length} Treffer (${recall.toFixed(0)}%)</span>, `+
    `${m.nFP} FP, Δ=${med.toFixed(1)}mm</div>`;
  // Canvas mit Overlay
  const cv = document.createElement('canvas');
  const scale = 0.5;
  cv.width = postImgData.width*scale; cv.height = postImgData.height*scale;
  const ctx = cv.getContext('2d');
  // post als Hintergrund
  const tmp = document.createElement('canvas');
  tmp.width = postImgData.width; tmp.height = postImgData.height;
  tmp.getContext('2d').putImageData(postImgData, 0, 0);
  ctx.drawImage(tmp, 0, 0, cv.width, cv.height);
  ctx.lineWidth = 2;
  // Spiegel
  ctx.strokeStyle = 'rgba(255,180,40,0.8)';
  ctx.beginPath(); ctx.arc(SP.cx*scale, SP.cy*scale, SP.r*scale, 0, 7); ctx.stroke();
  // GT
  gt.forEach((g, gi) => {
    const gx = (SP.cx + g.x*SP.pxPerMm)*scale, gy = (SP.cy + g.y*SP.pxPerMm)*scale;
    ctx.strokeStyle = m.ug.has(gi) ? 'rgba(255,220,60,1)' : 'rgba(80,140,255,1)';
    ctx.beginPath(); ctx.arc(gx, gy, 11, 0, 7); ctx.stroke();
  });
  // Detections
  dets.forEach((d, di) => {
    const dx = d.x*scale, dy = d.y*scale;
    ctx.strokeStyle = m.ud.has(di) ? 'rgba(60,255,60,1)' : 'rgba(255,60,60,1)';
    ctx.strokeRect(dx-6, dy-6, 12, 12);
  });
  div.appendChild(cv);
  document.getElementById('phases').appendChild(div);
  return { recall, nMatch: m.nMatch, nGt: gt.length, nFP: m.nFP, dists: m.dists };
}

(async () => {
  let totGt=0, totMatch=0, totFP=0, allDists=[];
  for (const phase of ['1a','1b']) {
    const refID = await loadImageData(`${phase}_ref.png`);
    const postID = await loadImageData(`${phase}_post.png`);
    const ref = TPDetect.imageDataToGray(refID);
    const post = TPDetect.imageDataToGray(postID);
    const t0 = performance.now();
    const { dets, shift } = TPDetect.streamDetect(ref.gray, post.gray, ref.W, ref.H, SP, 5.6,
      { thrRel: 0.30, snrMin: 6, maxShift: 10 });
    const dt = Math.round(performance.now()-t0);
    const m = match(dets, GT[phase], SP);
    const r = renderPhase(`Phase ${phase}`, postID, dets, GT[phase], m, shift, dt);
    totGt += r.nGt; totMatch += r.nMatch; totFP += r.nFP; allDists.push(...r.dists);
  }
  const med = allDists.length ? [...allDists].sort((a,b)=>a-b)[allDists.length>>1] : 0;
  const recall = 100*totMatch/totGt, prec = 100*totMatch/Math.max(1,totMatch+totFP);
  document.getElementById('summary').textContent =
    `GESAMT (Browser/canvas):\n`+
    `  Recall:    ${recall.toFixed(0)}%  (${totMatch}/${totGt})\n`+
    `  Precision: ${prec.toFixed(0)}%\n`+
    `  Median-Δ:  ${med.toFixed(1)} mm\n`+
    `  FP/Serie:  ${(totFP/2).toFixed(1)}\n\n`+
    `  Node-Referenz: 90% / 90% / 2.0mm / 0.5 FP  →  ${recall>=90&&prec>=90?'✓ MATCH':'⚠ Abweichung'}`;
})();
</script>
</body>
</html>
