<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainings-Set Ground-Truth Multi-Image</title>
<style>
  :root{--bg:#0e1116;--fg:#e8eef2;--dim:#8a99a8;--acc:#c8a84b;--line:#2a3340;--hot:#46c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
  header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:16px;margin:0}
  .nav{display:flex;gap:6px;align-items:center}
  .nav button{padding:5px 12px;background:#1a212b;color:var(--fg);border:1px solid var(--line);border-radius:4px;cursor:pointer}
  .nav button:hover{border-color:var(--acc)}
  .nav .idx{color:var(--dim);min-width:80px;text-align:center;font-family:'Share Tech Mono',monospace}
  .disz{display:flex;gap:4px}
  .disz button{padding:5px 10px;background:#1a212b;color:var(--fg);border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:13px}
  .disz button.active{font-weight:bold;border-width:2px}
  .disz button[data-d="kk25"].active{border-color:#46c;background:#193254}
  .disz button[data-d="gk25"].active{border-color:#d84;background:#3a2412}
  .disz button[data-d="leer"].active{border-color:#7a7;background:#1a3a1a}
  .main{display:flex;gap:14px;padding:12px;flex-wrap:wrap}
  .left{flex:0 0 auto;position:relative}
  .right{flex:1 1 280px;min-width:280px}
  canvas{background:#000;cursor:crosshair;border:1px solid var(--line);border-radius:4px;display:block;touch-action:none}
  .hint{color:var(--dim);font-size:12px;line-height:1.5;margin:6px 0 10px}
  .info{background:#1a212b;border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px}
  .info b{color:var(--acc)}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;font-family:'Share Tech Mono',monospace}
  th,td{text-align:left;padding:3px 5px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600}
  .row{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
  .row button{padding:5px 10px;background:#1a212b;color:var(--fg);border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:12px}
  .row button:hover{border-color:var(--acc)}
  .row .pri{background:#3a2812;border-color:var(--acc)}
  .export{background:#2a3340;border:1px solid var(--acc);padding:8px;border-radius:4px;margin-top:8px}
  textarea{width:100%;height:120px;background:#0a0d11;color:#cfe;border:1px solid var(--line);
       border-radius:4px;font-family:'Consolas',monospace;font-size:11px;padding:6px;resize:vertical}
  .gallery{display:flex;gap:3px;padding:6px;background:#0a0d11;border-radius:4px;overflow-x:auto;border:1px solid var(--line)}
  .gallery .thumb{width:60px;height:60px;cursor:pointer;border:2px solid transparent;border-radius:3px;flex-shrink:0;position:relative}
  .gallery .thumb img{width:100%;height:100%;object-fit:cover;border-radius:2px}
  .gallery .thumb.current{border-color:var(--acc)}
  .gallery .thumb .label{position:absolute;top:0;left:0;background:rgba(0,0,0,0.7);color:#fff;font-size:9px;padding:1px 3px;border-radius:0 0 3px 0;line-height:1}
  .gallery .thumb.done{box-shadow:inset 0 0 0 2px rgba(120,255,120,0.6)}
</style>
</head>
<body>
<header>
  <h1>◎ Trainings-Set GT</h1>
  <div class="nav">
    <button id="prev">◀ Vor</button>
    <div class="idx" id="idx">— / —</div>
    <button id="next">Nächstes ▶</button>
  </div>
  <div class="disz">
    <button data-d="kk25" id="d_kk25">.22 (KK)</button>
    <button data-d="gk25" id="d_gk25">9 mm (GK)</button>
    <button data-d="leer" id="d_leer">LEER (keine Treffer)</button>
  </div>
  <div style="flex:1"></div>
  <button id="exportAll" style="padding:6px 14px;background:var(--acc);color:#000;border:0;border-radius:4px;font-weight:bold;cursor:pointer">▼ ALLES EXPORTIEREN</button>
</header>

<div class="gallery" id="gallery"></div>

<div class="main">
  <div class="left">
    <canvas id="cv"></canvas>
    <div class="hint">Klick = Treffer setzen/entfernen. Klick auf Vor-Markierung (Auto-Detection) bestätigt sie. Zoom mit Browser-Strg/+.</div>
  </div>
  <div class="right">
    <div class="info">
      <div><b>Datei:</b> <span id="fname">—</span></div>
      <div><b>Auto-Disziplin:</b> <span id="auto_d">—</span></div>
      <div><b>Spiegel:</b> px/mm = <span id="ppm">—</span>, Mitte = <span id="sp_xy">—</span></div>
      <div><b>Treffer markiert:</b> <span id="hit_n">0</span></div>
    </div>
    <div class="row">
      <button id="acceptAll" class="pri">✓ Alle Auto-Marker bestätigen</button>
      <button id="clearAll">Alle löschen</button>
    </div>
    <table id="tbl">
      <thead><tr><th>#</th><th>Ring</th><th>mm</th><th>Uhr</th><th>x_mm</th><th>y_mm</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="export" id="exportBox" style="display:none">
      <textarea id="out" readonly></textarea>
      <div style="font-size:11px;color:var(--dim);margin-top:4px">Block kopieren & an Claude zurückgeben.</div>
    </div>
  </div>
</div>

<script>
const RINGS=[{r:10,rad:25},{r:9,rad:50},{r:8,rad:75},{r:7,rad:100},{r:6,rad:125},{r:5,rad:150},{r:4,rad:175},{r:3,rad:200},{r:2,rad:225},{r:1,rad:250}];
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let manifest=[], curIdx=0, state={};
let dispScale=1; let curImg=null;

function ringOf(d){ for(const x of RINGS){ if(d<=x.rad) return x.r; } return 0; }
function clockOf(dxmm,dymm){
  let a=Math.atan2(dxmm,-dymm)*180/Math.PI; if(a<0)a+=360;
  let h=Math.round(a/30); if(h===0)h=12; return h;
}

async function loadManifest(){
  const r = await fetch('manifest_auto.json');
  manifest = await r.json();
  // State pro Bild: { hits:[{x_px,y_px,confirmed}], disziplin }
  for(const m of manifest){
    if(!state[m.idx]){
      state[m.idx] = {
        hits: m.holes ? m.holes.map(h => ({x_px:h.x, y_px:h.y, auto:true, zone:h.zone})) : [],
        disziplin: m.auto_disziplin || 'kk25',
        confirmed_at: null
      };
    }
  }
  buildGallery();
  showImage(0);
}

function buildGallery(){
  const g = document.getElementById('gallery');
  g.innerHTML = '';
  manifest.forEach((m, i) => {
    const t = document.createElement('div');
    t.className = 'thumb';
    t.dataset.idx = i;
    t.innerHTML = `<img src="${m.file}" alt=""><div class="label">${m.idx}</div>`;
    t.onclick = () => showImage(i);
    g.appendChild(t);
  });
  updateGalleryState();
}

function updateGalleryState(){
  document.querySelectorAll('.thumb').forEach((t,i)=>{
    t.classList.toggle('current', i===curIdx);
    const st = state[manifest[i].idx];
    t.classList.toggle('done', !!st.confirmed_at);
  });
}

function showImage(i){
  if(i<0||i>=manifest.length) return;
  curIdx = i;
  const m = manifest[i];
  document.getElementById('fname').textContent = m.file;
  document.getElementById('auto_d').textContent = (m.auto_disziplin||'?') + ' (⌀'+(m.med_hole_diameter_mm||'?')+'mm)';
  document.getElementById('ppm').textContent = m.spiegel ? m.spiegel.px_per_mm.toFixed(2) : '—';
  document.getElementById('sp_xy').textContent = m.spiegel ? `(${m.spiegel.cx},${m.spiegel.cy})` : '—';
  document.getElementById('idx').textContent = `${i+1} / ${manifest.length}`;
  // Disziplin-Button aktualisieren
  const d = state[m.idx].disziplin;
  document.querySelectorAll('.disz button').forEach(b=>b.classList.toggle('active', b.dataset.d===d));
  // Bild laden
  curImg = new Image();
  curImg.onload = () => {
    const maxW = Math.min(900, window.innerWidth - 380);
    dispScale = Math.min(1, maxW / curImg.width);
    cv.width = curImg.width * dispScale;
    cv.height = curImg.height * dispScale;
    draw();
  };
  curImg.src = m.file;
  updateGalleryState();
  refreshTable();
}

function draw(){
  if(!curImg) return;
  ctx.drawImage(curImg, 0, 0, cv.width, cv.height);
  const m = manifest[curIdx];
  if(m.spiegel){
    const sp = m.spiegel;
    ctx.strokeStyle = 'rgba(255,180,40,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(sp.cx*dispScale, sp.cy*dispScale, sp.r*dispScale, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(sp.cx*dispScale, sp.cy*dispScale, 4, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,180,40,1)'; ctx.fill();
  }
  const hits = state[m.idx].hits;
  hits.forEach((h, i) => {
    const x = h.x_px * dispScale, y = h.y_px * dispScale;
    const col = h.auto ? 'rgba(255,200,80,0.9)' : 'rgba(80,255,80,1)';
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = col;
    ctx.font = 'bold 11px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(i+1, x, y);
  });
}

function refreshTable(){
  const m = manifest[curIdx];
  const sp = m.spiegel;
  const tb = document.getElementById('tb'); tb.innerHTML = '';
  if(!sp){ document.getElementById('hit_n').textContent='—'; return; }
  const ppm = sp.px_per_mm;
  state[m.idx].hits.forEach((h, i) => {
    const xmm = (h.x_px - sp.cx)/ppm;
    const ymm = (h.y_px - sp.cy)/ppm;
    const d = Math.hypot(xmm, ymm);
    tb.insertAdjacentHTML('beforeend',
      `<tr><td>${i+1}</td><td>${ringOf(d)||'M'}</td><td>${d.toFixed(0)}</td><td>${clockOf(xmm,ymm)}</td><td>${xmm.toFixed(0)}</td><td>${ymm.toFixed(0)}</td></tr>`);
  });
  document.getElementById('hit_n').textContent = state[m.idx].hits.length;
}

cv.addEventListener('click', e=>{
  const m = manifest[curIdx];
  if(!m.spiegel) return;
  const rect = cv.getBoundingClientRect();
  const px = (e.clientX - rect.left) / dispScale;
  const py = (e.clientY - rect.top) / dispScale;
  const hits = state[m.idx].hits;
  // Klick auf vorhandenen Treffer → entfernen
  const ppm = m.spiegel.px_per_mm;
  for(let i=0; i<hits.length; i++){
    const d = Math.hypot(hits[i].x_px-px, hits[i].y_px-py);
    if(d < 18/dispScale){ hits.splice(i,1); draw(); refreshTable(); return; }
  }
  // Sonst neuen Treffer setzen
  hits.push({x_px:px, y_px:py, auto:false});
  draw(); refreshTable();
});

document.getElementById('prev').onclick = ()=>showImage(curIdx-1);
document.getElementById('next').onclick = ()=>{
  // markiere current als confirmed wenn nicht leer-pending
  state[manifest[curIdx].idx].confirmed_at = Date.now();
  showImage(curIdx+1);
};
document.getElementById('clearAll').onclick = ()=>{
  state[manifest[curIdx].idx].hits = [];
  draw(); refreshTable();
};
document.getElementById('acceptAll').onclick = ()=>{
  state[manifest[curIdx].idx].hits.forEach(h => h.auto = false);
  draw(); refreshTable();
};
document.querySelectorAll('.disz button').forEach(b=>{
  b.onclick = ()=>{
    const d = b.dataset.d;
    state[manifest[curIdx].idx].disziplin = d;
    if(d==='leer'){
      // LEER bedeutet keine Treffer
      state[manifest[curIdx].idx].hits = [];
      draw(); refreshTable();
    }
    document.querySelectorAll('.disz button').forEach(x=>x.classList.toggle('active', x.dataset.d===d));
  };
});

document.getElementById('exportAll').onclick = ()=>{
  // alle als confirmed markieren bevor export
  for(const m of manifest){ if(!state[m.idx].confirmed_at) state[m.idx].confirmed_at = Date.now(); }
  const out = {
    tool: 'gt_multi',
    datum: '2026-06-01',
    n_scheiben: manifest.length,
    scheiben: manifest.map(m => {
      const st = state[m.idx];
      const sp = m.spiegel;
      const ppm = sp ? sp.px_per_mm : null;
      const treffer = sp ? st.hits.map((h, i) => {
        const xmm = (h.x_px - sp.cx)/ppm;
        const ymm = (h.y_px - sp.cy)/ppm;
        const d = Math.hypot(xmm,ymm);
        return {n:i+1, x_mm:+xmm.toFixed(1), y_mm:+ymm.toFixed(1),
                dist_mm:+d.toFixed(1), ring:ringOf(d), uhr:clockOf(xmm,ymm)};
      }) : [];
      return {
        idx: m.idx, file: m.file,
        disziplin: st.disziplin,
        spiegel: m.spiegel,
        anzahl_treffer: treffer.length,
        treffer: treffer,
      };
    })
  };
  const json = JSON.stringify(out, null, 2);
  const box = document.getElementById('exportBox');
  box.style.display = 'block';
  document.getElementById('out').value = 'GT_MULTI_2026-06-01 <<<\n' + json + '\n>>> GT_MULTI';
  document.getElementById('out').select();
};

window.addEventListener('keydown', e=>{
  if(e.key === 'ArrowLeft') document.getElementById('prev').click();
  else if(e.key === 'ArrowRight') document.getElementById('next').click();
  else if(e.key === '1') document.getElementById('d_kk25').click();
  else if(e.key === '2') document.getElementById('d_gk25').click();
  else if(e.key === '0') document.getElementById('d_leer').click();
});

loadManifest();
</script>
</body>
</html>
